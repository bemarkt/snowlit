name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios_runtime:
        description: iPhone simulator runtime to verify
        type: choice
        options: ['26.5', '26.0']
        default: '26.5'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS / ${{ matrix.device }}
    runs-on: macos-26
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        device: [phone]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SNOWLIT_IOS_RUNTIME: ${{ inputs.ios_runtime || '26.5' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        id: baseline
        run: bash scripts/ci.sh "${{ matrix.device }}"
      - name: Run isolated WebKit integration probes
        run: bash scripts/probe_ios.sh "${{ matrix.device }}"
      - name: Observe recovery from uncooperative JavaScript
        if: ${{ !cancelled() && matrix.device == 'phone' && steps.baseline.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh phone recovery
      - name: Observe system page curl gestures
        if: ${{ !cancelled() && steps.baseline.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh "${{ matrix.device }}" reader-ui
      - name: Interrupt and reopen isolated storage
        if: ${{ !cancelled() && steps.baseline.conclusion == 'success' }}
        run: bash scripts/probe_storage.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.device }}-${{ github.sha }}
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14
