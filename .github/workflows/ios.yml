name: iOS
run-name: iOS ${{ inputs.task || 'verify' }} / ${{ github.ref_name }} / ${{ inputs.ios_runtime || '26.5' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Full verification or a focused experiment
        type: choice
        options: ['verify', 'integration', 'auth', 'recovery', 'product-ui', 'reader-ui', 'storage', 'ipa', 'runtime-check']
        default: 'verify'
      ios_runtime:
        description: iPhone simulator runtime to verify
        type: choice
        options: ['26.5', '26.0']
        default: '26.5'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.task || 'verify' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ inputs.task != 'runtime-check' && inputs.task != 'ipa' }}
    name: iOS / ${{ matrix.device }} / ${{ matrix.suite }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        device: [phone]
        # Each suite owns its runner and simulator. A failing recovery probe
        # cannot delay, cancel or leave processes behind for the other suites.
        suite: ${{ fromJSON((inputs.task == 'verify' || inputs.task == '') && '["baseline","integration","recovery","product-ui","reader-ui","storage"]' || format('["{0}"]', inputs.task)) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SNOWLIT_IOS_RUNTIME: ${{ inputs.ios_runtime || '26.5' }}
      SNOWLIT_CI_TASK: ${{ inputs.task || 'verify' }}
      SNOWLIT_CI_SUITE: ${{ matrix.suite }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify probe tooling before building the App
        id: probe-tools
        timeout-minutes: 2
        run: bash scripts/verify_probe_tools.sh
      - name: Restore locked package checkouts
        id: package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('Packages/SnowlitKit/Package.swift', 'Packages/SnowlitKit/Package.resolved', 'Snowlit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Prepare signed simulator test host
        id: host
        timeout-minutes: 15
        run: bash scripts/ci.sh "${{ matrix.device }}" prepare
      - name: Save resolved package checkouts
        # Keep successfully built dependencies even if a later behavior test fails.
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && steps.package-cache.outputs.cache-hit != 'true' && (matrix.suite == 'baseline' || env.SNOWLIT_CI_TASK != 'verify') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Run baseline checks
        id: baseline
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'baseline' }}
        timeout-minutes: 28
        run: bash scripts/ci.sh "${{ matrix.device }}" baseline
      - name: Run isolated WebKit integration probes
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'integration' }}
        timeout-minutes: 25
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh "${{ matrix.device }}"
      - name: Run installed source authentication probes
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'auth' }}
        timeout-minutes: 20
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh "${{ matrix.device }}" auth
      - name: Run product search and reading UI flows
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'product-ui' }}
        timeout-minutes: 20
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh "${{ matrix.device }}" product-ui
      - name: Observe recovery from uncooperative JavaScript
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'recovery' }}
        timeout-minutes: 25
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh phone recovery
      - name: Observe system page curl gestures
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'reader-ui' }}
        timeout-minutes: 25
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_ios.sh "${{ matrix.device }}" reader-ui
      - name: Interrupt and reopen isolated storage
        if: ${{ !cancelled() && steps.host.conclusion == 'success' && matrix.suite == 'storage' }}
        timeout-minutes: 25
        env:
          SNOWLIT_PROBE_TOOLS_PREPARED: ${{ steps.probe-tools.conclusion == 'success' }}
        run: bash scripts/probe_storage.sh
      - name: Record verification scope
        if: always()
        run: |
          mkdir -p build/evidence
          {
            printf 'Task: %s\nSuite: %s\nSource: %s\nRuntime: %s\n' "$SNOWLIT_CI_TASK" "$SNOWLIT_CI_SUITE" "$GITHUB_SHA" "$SNOWLIT_IOS_RUNTIME"
            if [ "$SNOWLIT_CI_TASK" = verify ]; then
              printf 'This job covers one suite only. Full verification requires baseline, integration, recovery, reader-ui, storage AND the Release device build at this source revision.\n'
            else
              printf 'Focused verification only. Unselected suites were not executed.\n'
              printf 'Full acceptance requires the verify task at the same source revision.\n'
            fi
          } | tee build/evidence/verification-scope.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.device }}-${{ matrix.suite }}-${{ github.sha }}
          path: build/evidence/
          if-no-files-found: error
          retention-days: 14

  release-build:
    name: iOS / Release device build
    if: ${{ inputs.task == 'verify' || inputs.task == 'ipa' || github.event_name != 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore locked package checkouts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('Packages/SnowlitKit/Package.swift', 'Packages/SnowlitKit/Package.resolved', 'Snowlit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build unsigned Release for iPhone
        run: bash scripts/build_release.sh
      - name: Upload unsigned IPA and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Snowlit-unsigned-ipa-${{ github.sha }}
          path: |
            build/ipa/*.ipa
            build/ipa/*.sha256
            build/ipa/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Release build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ github.sha }}
          path: build/evidence/release/
          if-no-files-found: error
          retention-days: 14

  runtime-availability:
    name: Minimum runtime availability
    if: ${{ inputs.task == 'runtime-check' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect and request the exact minimum runtime
        run: |
          set -euo pipefail
          evidence="$PWD/build/evidence/runtime-availability"
          mkdir -p "$evidence"
          {
            git rev-parse HEAD
            xcodebuild -version
            sw_vers
            printf 'Runner image: %s / %s\n' "$ImageOS" "$ImageVersion"
            printf 'Run: %s / attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > "$evidence/environment.txt"
          printf '%s\n' /Applications/Xcode*.app > "$evidence/installed-xcode-paths.txt"
          downloader=/Applications/Xcode_26.0.1.app/Contents/Developer
          if [ ! -d "$downloader" ]; then
            printf 'Required downloader is absent: %s\n' "$downloader" > "$evidence/downloader.txt"
            exit 1
          fi
          DEVELOPER_DIR="$downloader" xcodebuild -version > "$evidence/downloader.txt"
          # Runtime availability only; this job does not build or test the App.
          DEVELOPER_DIR="$downloader" bash scripts/prepare_runtime.sh 26.0 "$evidence"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-availability-${{ github.sha }}
          path: build/evidence/runtime-availability/
          if-no-files-found: error
          retention-days: 14
